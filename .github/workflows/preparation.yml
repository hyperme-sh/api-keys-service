name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        shell: bash
        run: |
          set -euo pipefail
          context=$(mktemp -d "$RUNNER_TEMP/api-keys-runtime.XXXXXX")
          image="api-keys-preparation:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf "$context"' EXIT
          RELEASE_ARTIFACT_DIR="$context" bash scripts/check-package.sh --fixtures
          python3 scripts/prepare_runtime_context.py "$context"
          revision=$(git rev-parse HEAD)
          docker build -f Dockerfile --label "org.opencontainers.image.revision=$revision" -t "$image" "$context"
          python3 scripts/qualify_runtime.py --image "$image"
