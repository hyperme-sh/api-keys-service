name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    outputs:
      digest: ${{ steps.registry.outputs.digest }}
    concurrency:
      group: api-keys-main-runtime
      cancel-in-progress: false
    timeout-minutes: 15
    environment: controlplane-libs-read
    steps:
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            auth-service
            controlplane-api
            controlplane-core
            controlplane-db
            controlplane-events
            controlplane-identity
            controlplane-tenancy
            user-service
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate API keys package
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN" || { echo 'Private dependency read access is required'; exit 1; }
          header=$(printf 'x-access-token:%s' "$DEPENDENCY_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=8
          export GIT_CONFIG_KEY_0=http.https://github.com/hyperme-sh/controlplane-api.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_1=http.https://github.com/hyperme-sh/controlplane-tenancy.git.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_2=http.https://github.com/hyperme-sh/controlplane-identity.git.extraheader
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_3=http.https://github.com/hyperme-sh/controlplane-db.git.extraheader
          export GIT_CONFIG_VALUE_3="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_4=http.https://github.com/hyperme-sh/controlplane-events.git.extraheader
          export GIT_CONFIG_VALUE_4="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_5=http.https://github.com/hyperme-sh/user-service.git.extraheader
          export GIT_CONFIG_VALUE_5="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_6=http.https://github.com/hyperme-sh/controlplane-core.git.extraheader
          export GIT_CONFIG_VALUE_6="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_7=http.https://github.com/hyperme-sh/auth-service.git.extraheader
          export GIT_CONFIG_VALUE_7="AUTHORIZATION: basic $header"
          unset DEPENDENCY_READ_TOKEN
          bash scripts/check-package.sh
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RELEASE_ARTIFACT_DIR/requirements.txt"
          uv run --isolated --no-project --python 3.13 --with pip python -m pip wheel --no-deps \
            -r "$RELEASE_ARTIFACT_DIR/requirements.txt" -w "$RELEASE_ARTIFACT_DIR/wheelhouse"
      - name: Qualify registry runtime from the tested distribution
        run: |
          set -euo pipefail
          cd "$RELEASE_ARTIFACT_DIR"
          python3 -m zipfile -c tested-dist.zip *.whl *.tar.gz
          cd "$GITHUB_WORKSPACE"
          source="api-keys-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build -f Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$source" "$RELEASE_ARTIFACT_DIR"
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint python "$source" -Ic 'from api_keys_service.app import app; assert "/api/v1/internal/validate" in app.openapi()["paths"]'
      - name: Publish qualified runtime to GHCR
        id: registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")
          source="api-keys-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/runtime"
          target="$repo:sha-$GITHUB_SHA"
          trap 'docker image rm "$target" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$source" "$target"
          docker push "$target"
          digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$repo@$digest"
          test "$(docker image inspect "$source" --format '{{.Id}}')" = "$(docker image inspect "$repo@$digest" --format '{{.Id}}')"
          # An older rerun can qualify its binary without rolling TEST back.
          main_sha=$(GH_TOKEN="$REGISTRY_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$repo:test" "$repo@$digest"
            test "$(docker buildx imagetools inspect "$repo:test" --format '{{.Manifest.Digest}}')" = "$digest"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Clean job-owned runtime and package bytes
        if: always()
        run: |
          docker image rm "api-keys-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
          if [[ "${RELEASE_ARTIFACT_DIR:-}" == "$RUNNER_TEMP"/release-dist.* ]]; then rm -rf "$RELEASE_ARTIFACT_DIR"; fi
  evidence:
    name: Qualified OCI ${{ needs.package.outputs.digest }}
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - name: Verify qualified manifest identity
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
