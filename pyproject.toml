[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-keys-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@edac59b2cc55923c983a11a451c4bed9ce53edef",
    "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@5103bdff46a0eb15edb91c70e37a678b05b102e6",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@b9af19a4fb5cd68c7ce746b621347ea3b2e5015b",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@17e8c60bc2fea5af890299624ec97e1e7148b2a2",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@d8bc887460c08f30c6a1dcb951bac042bad326a7",
    "bcrypt>=4.2.0",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5675e7b617db705a7b0caf25f2d65d8a492f32b1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_keys_service"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
